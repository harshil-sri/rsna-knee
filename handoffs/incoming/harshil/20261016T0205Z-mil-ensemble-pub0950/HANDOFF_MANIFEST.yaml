model_contract:
  input: knee MRI DICOM study; load all series dirs; slices sorted by ImagePositionPatient[2] (SliceLocation
    fallback); per-slice cv2.INTER_LINEAR resize with aspect-preserving base fit; percentile window normalize
    (2.0, 98.0); MONOCHROME1 inverted
  windows: 42 windows/study round-robin across series proportional to size; window = 5 consecutive slices;
    short series pad by repeating last slice; resize_volume to 224x224 per slice
  embeddings_nb1: timm vit_small_patch14_dinov2.lvd142m, in_chans=5, img_size=224, num_classes=0, patch-token
    mean over PREFIX-stripped tokens (fp16), saved .npz per study (emb float16)
  model_nb2: 'GatedAttentionMIL(in=384, hidden=128, out=12) — attention_v Linear+tanh, attention_u Linear+sigmoid,
    attention_weights Linear(hidden,1), softmax over windows, masked sum, classifier Linear. 5 folds trained
    (SEED 42+fold), ckpt = {''state_dicts'': [5 sd], ''label_cols'', ''hidden'', ''val_auc''}'
  output: 12 sigmoid probabilities
  submission_columns: 'Verified from source/nb3_submit.ipynb: label_cols = [c for c in sample.columns
    if c != ''StudyInstanceUID'']; submission DataFrame built via pd.DataFrame(rows, columns=sample.columns)
    written to /kaggle/working/submission.csv. The single ''Abnormality'' column is NOT used; final submission
    = per-finding probabilities for 12 findings.'
  label_column_order:
  - ACL
  - MCL
  - Medial Meniscus
  - Lateral Meniscus
  - Medial OA
  - Lateral OA
  - PF OA
  - Effusion
  - Synovitis
  - Baker's
  - Contusion
  - Fracture
  precision: fp32 inference (no autocast in nb3)
  logit_aggregation: 'Verified from source/nb3_submit.ipynb predict_study(): logits = torch.stack([h(emb)
    for h in heads], 0).mean(0); final = torch.sigmoid(logits). Exact: mean over 5 fold-head logits (raw
    logits, pre-sigmoid), then single sigmoid applied to the averaged logits.'
  fallback: no series dir → row of all 0.5; empty slices → same; never crash (per-study try/except)
label_lineage: comp train.csv = 4407 studies, only 58 have hard labels (gold58); Daksh LLM-teacher pipeline
  produced train_weak_v2 (weak soft labels, labeler macro-AUC vs gold58 0.709) then fused v1_targets.csv
  (teacher soft labels, quality 0.89 vs gold58 — per-class MAE 0.135-0.379, exact-match 41-55/58, verified
  vs truth file); v1_weights.csv = per-study confidence weights; gold rows in v1_targets carry SOFT teacher
  labels (NOT ground-truth hard labels) — training never saw gold hard labels; gold hard labels used ONLY
  in score_gold.py receipts (no contamination).
fold_lineage: folds.csv (sha256 8ea359a25c841c31554da17c20c0b7ba6f688c0d87975af38ff091d42bfd186b), canonical
